<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Дашборд тренировок</title>
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --text: #1c2230;
    --text-muted: #5b6478;
    --border: #dfe3ec;
    --accent: #3763e8;
    --ok: #1f8a5f;
    --warn: #b3541e;
    --neutral: #5b6478;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b1f2a;
      --text: #e7e9f0;
      --text-muted: #9aa2b6;
      --border: #2b3040;
      --accent: #7c96ff;
      --ok: #4fbf8f;
      --warn: #e08f4f;
      --neutral: #9aa2b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--text-muted); margin: 0 0 24px; }
  a { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1 1 140px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--text-muted); }
  input[type="text"],
  input[type="number"] {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    width: 100%;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .status { font-size: 14px; margin-bottom: 16px; color: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Профиль</h1>
    <a href="{{ url_for('dashboard') }}">← Дашборд</a>
  </div>
  <p class="lead">{{ user.email }}</p>

  <div class="card">
    {% if saved %}<div class="status">Профиль обновлён</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" value="{{ user.name or '' }}">
      </div>
      <div class="row">
        <div class="field">
          <label for="age">Возраст</label>
          <input type="number" id="age" name="age" min="1" max="120" value="{{ user.age if user.age is not none else '' }}">
        </div>
        <div class="field">
          <label for="max_hr">Макс. пульс</label>
          <input type="number" id="max_hr" name="max_hr" min="1" max="260" value="{{ user.max_hr if user.max_hr is not none else '' }}">
        </div>
      </div>
      <div class="field">
        <label for="weight">Вес, кг</label>
        <input type="number" id="weight" name="weight" min="1" step="0.1" value="{{ user.weight if user.weight is not none else '' }}">
      </div>
      <button type="submit">Сохранить</button>
    </form>
  </div>

  <p class="lead"><a href="{{ url_for('logout') }}">Выйти</a></p>
</div>
</body>
</html>
