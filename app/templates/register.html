<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — Дашборд тренировок</title>
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --text: #1c2230;
    --text-muted: #5b6478;
    --border: #dfe3ec;
    --accent: #3763e8;
    --ok: #1f8a5f;
    --warn: #b3541e;
    --neutral: #5b6478;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b1f2a;
      --text: #e7e9f0;
      --text-muted: #9aa2b6;
      --border: #2b3040;
      --accent: #7c96ff;
      --ok: #4fbf8f;
      --warn: #e08f4f;
      --neutral: #9aa2b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--text-muted); margin: 0 0 24px; }
  a { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1 1 140px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--text-muted); }
  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="number"] {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    width: 100%;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .status { font-size: 14px; margin-bottom: 16px; }
  .status.error { color: var(--warn); }
  .hint-text { font-size: 12px; color: var(--text-muted); margin: -20px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Регистрация</h1>
  <p class="lead">Создайте аккаунт, чтобы сохранять тренировки и видеть прогресс.</p>

  <div class="card">
    {% if error %}<div class="status error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="row">
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
          <label for="password2">Повторите пароль</label>
          <input type="password" id="password2" name="password2" required>
        </div>
      </div>
      <p class="hint-text">Необязательно — заполнить сразу или позже в профиле:</p>
      <div class="row">
        <div class="field">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name">
        </div>
        <div class="field">
          <label for="age">Возраст</label>
          <input type="number" id="age" name="age" min="1" max="120">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="max_hr">Макс. пульс</label>
          <input type="number" id="max_hr" name="max_hr" min="1" max="260">
        </div>
        <div class="field">
          <label for="weight">Вес, кг</label>
          <input type="number" id="weight" name="weight" min="1" step="0.1">
        </div>
      </div>
      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>

  <p class="lead">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
</body>
</html>
