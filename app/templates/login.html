<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Дашборд тренировок</title>
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --text: #1c2230;
    --text-muted: #5b6478;
    --border: #dfe3ec;
    --accent: #3763e8;
    --ok: #1f8a5f;
    --warn: #b3541e;
    --neutral: #5b6478;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b1f2a;
      --text: #e7e9f0;
      --text-muted: #9aa2b6;
      --border: #2b3040;
      --accent: #7c96ff;
      --ok: #4fbf8f;
      --warn: #e08f4f;
      --neutral: #9aa2b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
    padding-inline: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: var(--text-muted); margin: 0 0 24px; }
  a { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--text-muted); }
  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="number"] {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .status { font-size: 14px; margin-bottom: 16px; }
  .status.error { color: var(--warn); }
  .status.hint { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Вход</h1>
  <p class="lead">Войдите, чтобы увидеть свой дашборд тренировок.</p>

  <div class="card">
    {% if error %}<div class="status error">{{ error }}</div>{% endif %}
    {% if hint %}<div class="status hint">{{ hint }} <a href="{{ url_for('register') }}">Зарегистрироваться</a></div>{% endif %}
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Войти</button>
    </form>
  </div>

  <p class="lead">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</div>
</body>
</html>
